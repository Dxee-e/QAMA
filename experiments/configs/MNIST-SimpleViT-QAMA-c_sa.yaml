base:
# define base config
  dataset: MNIST
  model: SimpleViT
  QAMA: True

# backend setting
backend_solver:
  solver: c_sa
  c_sa:
    initial_temperature: 1000.0
    alpha: 0.99
    cutoff_temperature: 0.001
    iterations_per_t: 5
    patience: 50
    is_local_search: True
    flag_evolution_history: False
    history_file_path: ""
    rand_seed: null
    is_input_check: False

# model setting
model_setting:
  image_size: [28, 28]
  patch_size: [4, 4]
  num_classes: 10
  dim: 64
  depth: 1
  heads: 8
  mlp_dim: 64
  dim_head: 8
  channels: 1

# train setting
train_setting:
  batch_size: 128
  num_epochs: 50
  learning_rate: 0.001
  device: 'cuda:0'
  seed: 421