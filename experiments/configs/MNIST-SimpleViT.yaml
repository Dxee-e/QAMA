base:
# define base config
  dataset: MNIST
  model: SimpleViT
  QAMA: False

# model setting
model_setting:
  image_size: [28, 28]
  patch_size: [4, 4]
  num_classes: 10
  dim: 64
  depth: 1
  heads: 8
  mlp_dim: 64
  dim_head: 8
  channels: 1

# train setting
train_setting:
  batch_size: 128
  num_epochs: 50
  learning_rate: 0.001
  device: 'cuda:0'
  seed: 421