base:
# define base config
  dataset: SST2
  model: TextTransformer
  QAMA: False

# model setting
model_setting:
  max_seq_len: 512
  num_classes: 2
  dim: 64
  depth: 1
  heads: 1
  mlp_dim: 64

# train setting
train_setting:
  batch_size: 64
  num_epochs: 50
  learning_rate: 0.001
  device: 'cuda:0'
  seed: 42