base:
# define base config
  dataset: IMDB
  model: TextTransformer
  QAMA: True

# backend setting
backend_solver:
  solver: c_sa
  c_sa:
    initial_temperature: 1000.0
    alpha: 0.99
    cutoff_temperature: 0.001
    iterations_per_t: 5
    patience: 50
    is_local_search: True
    flag_evolution_history: False
    history_file_path: ""
    rand_seed: null
    is_input_check: False

# model setting
model_setting:
  max_seq_len: 512
  num_classes: 2
  dim: 64
  depth: 1
  heads: 1
  mlp_dim: 64

# train setting
train_setting:
  batch_size: 24
  num_epochs: 50
  learning_rate: 0.001
  device: 'cuda:0'
  seed: 42